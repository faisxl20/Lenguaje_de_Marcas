<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | SEVILLA FC</title>
  <meta name="description" content="Formulario de atención y contacto para aficionados del Sevilla FC: consultas, dudas y atención al sevillista.">
  <meta name="keywords" content="Sevilla FC, contacto, afición, formulario, atención al sevillista">
  <meta name="author" content="Faisal Baroudi Tarfa">
</head>
<body>
  <!-- NAV: aquí irá el menú (UD4) -->

  <!-- Cabecera de la página de contacto -->
  <div>
    <h1>Contacto con el Sevilla FC</h1>
    <p>Ponte en contacto con el Sevilla FC para resolver cualquier consulta sobre abonos, entradas, peñas o información del club.</p>
  </div>

  <!-- Bloque del formulario de atención al aficionado -->
  <div>
    <h2>Formulario de atención al sevillista</h2>

    <form action="#" method="post">
      <!-- Primer bloque: Datos personales del aficionado -->
      <fieldset>
        <legend>Datos personales del aficionado</legend>

        <p>
          <label for="nombre">Nombre y apellidos:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Faisal Baroudi" required minlength="3" maxlength="60" autofocus>
        </p>

        <p>
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required maxlength="80">
        </p>

        <p>
          <label for="telefono">Teléfono de contacto:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 612345678" pattern="[0-9]{9}">
        </p>

        <p>
          <label for="clave-socio">Clave o PIN de abonado (opcional):</label>
          <input type="password" id="clave-socio" name="clave_socio" placeholder="4 a 8 dígitos" minlength="4" maxlength="8">
        </p>
      </fieldset>
    </form>
  </div>

  <!-- Pie de página -->
  <footer>
    <p>&copy; 2026 Faisal Baroudi Tarfa</p>
  </footer>
</body>
</html>
